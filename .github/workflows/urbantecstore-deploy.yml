name: Desplegar Urbantecstore

# Publica urbantecstore.com en Cloudflare cada vez que cambia la tienda.
# Se activa cuando el repositorio tiene los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main, claude/fervent-maxwell-s6zgyf]
    paths: ['urbantechno-store/**', '.github/workflows/urbantecstore-deploy.yml']
  workflow_dispatch:

concurrency:
  group: urbantecstore-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: urbantechno-store
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Revisar secretos
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "Faltan los secretos de Cloudflare: se omite el despliegue."; fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: urbantechno-store/package-lock.json
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ok == 'true'
        run: npm run build
      - if: steps.secrets.outputs.ok == 'true'
        run: node cloudflare/build-worker.mjs
      - if: steps.secrets.outputs.ok == 'true'
        working-directory: urbantechno-store/cloudflare
        run: npx --yes wrangler@4 deploy
